name: release

# The daemon binary, one platform gem per target.
#
# Cross-compilation is the reason this exists as CI rather than a local rake
# task: `rake build[arm64-darwin]` works on a Mac and cannot produce a
# linux-musl binary, so the matrix IS the build. plans/16 listed this as the
# last unbuilt piece.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gem: arm64-darwin,       target: aarch64-apple-darwin,       os: macos-14 }
          - { gem: x86_64-darwin,      target: x86_64-apple-darwin,        os: macos-13 }
          - { gem: aarch64-linux-gnu,  target: aarch64-unknown-linux-gnu,  os: ubuntu-latest, cross: true }
          - { gem: x86_64-linux-gnu,   target: x86_64-unknown-linux-gnu,   os: ubuntu-latest }
          # musl is not optional: most container images are Alpine, where a gnu
          # binary fails at exec with a linker error rather than anything
          # actionable.
          - { gem: aarch64-linux-musl, target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { gem: x86_64-linux-musl,  target: x86_64-unknown-linux-musl,  os: ubuntu-latest, cross: true }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --bin stampeded --target ${{ matrix.target }}
          else
            cargo build --release --bin stampeded --target ${{ matrix.target }}
          fi

      # A binary that cannot start is not a release. --help exercises argument
      # parsing without needing a database.
      - name: Smoke test
        if: '!matrix.cross'
        run: ./target/${{ matrix.target }}/release/stampeded --help

      # rama-dns runs bindgen on Linux and needs libclang. Only for the
      # native Linux build -- `cross` compiles inside its own container, which
      # carries its own toolchain.
      - name: install libclang (native linux builds)
        if: runner.os == 'Linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: actions/upload-artifact@v4
        with:
          name: stampeded-${{ matrix.gem }}
          path: target/${{ matrix.target }}/release/stampeded

  gems:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.4" }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      # One gem per platform, binary inside. `rake stage_schema` copies
      # schema/*.sql in from the repo root -- without it the gem ships no
      # schema and every install fails at stampeded:install.
      - name: Assemble platform gems
        working-directory: ruby
        run: |
          set -euo pipefail
          bundle exec rake stage_schema
          for dir in ../artifacts/stampeded-*; do
            plat="${dir#../artifacts/stampeded-}"
            mkdir -p "exe/$plat"
            cp "$dir/stampeded" "exe/$plat/stampeded"
            chmod +x "exe/$plat/stampeded"
            STAMPEDED_GEM_PLATFORM="$plat" gem build stampeded.gemspec
          done
          # And the platformless one, for platforms we do not cross-compile.
          bundle exec rake package_generic
          ls -la ./*.gem

      - uses: actions/upload-artifact@v4
        with:
          name: gems
          path: ruby/*.gem
