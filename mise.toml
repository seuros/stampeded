[tools]
# 1.98 because mcp-host 0.3.2 requires it (mcphost-rs pins the same).
# components, because CI runs clippy: mise installs the toolchain via rustup,
# and a bare toolchain has no cargo-clippy in it. Declaring it here keeps the
# whole toolchain definition in one file instead of a `rustup component add`
# step that only the workflow knows about.
rust = { version = "1.98", components = "clippy,rustfmt" }
# The gemspec requires >= 4.0. Declared here so CI installs the same Ruby the
# gem is built against, rather than a version picked in a workflow file that
# nobody checks against the gemspec -- which is how the release workflow came
# to build a >= 4.0 gem on 3.4.
ruby = "4.0"
