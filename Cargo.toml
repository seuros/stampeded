[workspace]
resolver = "3"
members = ["crates/stampeded"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "BSD-3-Clause"
repository = "https://github.com/seuros/stampeded"
authors = ["Abdelkader Boudih"]

[workspace.dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros"] }
uuid = { version = "1.26", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# jiff for all timezone arithmetic; chrono stays at the sqlx boundary only,
# because sqlx 0.9 has no jiff support. See crates/stampeded/src/cron.rs.
jiff = "0.2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optional, behind features. rama carries the HTTP edge and the dashboard;
# mcp-host the control plane. A library embedding the queue pays for neither.
rama = { version = "0.4", default-features = false, features = ["http-full"] }
mcp-host = { version = "0.3", features = ["macros", "http", "stdio"] }
schemars = "1"

# The machines family — see plans/02-crate-family.md
state-machines = "0.21"
chrono-machines = "0.8"
breaker-machines = { version = "0.17", features = ["async"] }
throttle-machines = "0.2"
