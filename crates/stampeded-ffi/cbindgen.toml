language = "C"
include_guard = "STAMPEDED_H"
cpp_compat = true
documentation_style = "c99"
usize_is_size_t = true
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
header = """
/* stampeded C ABI. Generated by cbindgen from crates/stampeded-ffi; do not edit.
 * On STAMPEDED_ERROR, or NULL from a constructor, stampeded_last_error() says why. */"""
after_includes = """
#if defined(__cplusplus) && __cplusplus >= 201703L
#define STAMPEDED_NODISCARD [[nodiscard]]
#elif defined(__STDC_VERSION__) && __STDC_VERSION__ >= 202311L
#define STAMPEDED_NODISCARD [[nodiscard]]
#else
#define STAMPEDED_NODISCARD
#endif"""

[fn]
must_use = "STAMPEDED_NODISCARD"

[export.rename]
"Client" = "stampeded_client"
"PullerHandle" = "stampeded_puller"
"LeaseHandle" = "stampeded_lease"
"EnqueueOptions" = "stampeded_enqueue_options"
"PullerOptions" = "stampeded_puller_options"
"Steps" = "stampeded_steps"
